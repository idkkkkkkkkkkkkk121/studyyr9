<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Revision</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#16201a;--mute:#5c6a62;--line:#dfe4de;--acc:#0f7a5c;--acc-ink:#fff;--ok:#1b9e4b;--bad:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--card:#1a2420;--ink:#eef3ef;--mute:#9aaaa1;--line:#2c3a33;--acc:#3ecf9a;--acc-ink:#06241a}}

*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:.2em 0 .1em;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:650;cursor:pointer;width:100%}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
label.n{font-weight:600;display:block}
.inp{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px;margin:6px 0 4px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 16px}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem}
.q{font-size:1.15rem;font-weight:600;margin:6px 0 16px}
.prop{font-size:1.05rem;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--acc) 12%,var(--card));margin-bottom:14px;border-left:4px solid var(--acc)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;font:inherit;cursor:pointer;transition:background .35s ease,border-color .35s ease}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.opt:disabled{cursor:default}
.exp{margin:14px 0;padding:12px 14px;border-left:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card));border-radius:8px;font-size:.95rem}
.big{font-size:3rem;font-weight:800;margin:.1em 0}
ul.miss{padding-left:18px;color:var(--mute)}ul.miss b{color:var(--ink)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:50}
#flash.red{background:radial-gradient(ellipse at center,rgba(217,48,37,0) 38%,rgba(217,48,37,.8) 100%)}
#flash.green{background:radial-gradient(ellipse at center,rgba(27,158,75,0) 38%,rgba(27,158,75,.75) 100%)}
#flash.red.show{animation:pulse 1.5s cubic-bezier(.4,0,.2,1) forwards}
#flash.green.show{animation:pulse 1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes pulse{0%{opacity:0}35%{opacity:1}65%{opacity:1}100%{opacity:0}}
.warn{background:var(--bad);color:#fff;border-radius:12px;padding:10px 14px;font-weight:650;margin:-8px 0 16px}
.hide{display:none}
</style></head>
<body>
<div id="flash"></div>
<main>
<section id="home">
 <h1>Exam Revision</h1><p class="sub">Pick a class, how many questions, and the question type.</p>
 <div class="card">
  <label class="n">Class</label><div class="chips" id="classes"></div>
  <label class="n">Topics</label><div class="chips" id="chips"></div>
  <div id="warn" class="warn hide">No silly, this website is for exam revision/practice</div>
  <label class="n" for="count">Number of questions</label>
  <input id="count" class="inp" type="number" min="1" value="10" inputmode="numeric"><div class="sub" id="avail" style="font-size:.85rem"></div>
  <label class="n">Question type</label><div class="chips" id="types"></div>
  <button class="btn" id="start">Start quiz</button>
 </div>
</section>
<section id="play" class="hide">
 <div class="meta"><span id="pos"></span><span id="score"></span></div>
 <div class="bar"><i id="prog"></i></div>
 <div class="card">
  <div class="meta" id="topic"></div><div class="q" id="q"></div>
  <div id="body"></div>
  <div id="exp" class="exp hide"></div>
  <button class="btn alt hide" id="fix">Mark me correct</button>
  <button class="btn hide" id="next" style="margin-top:10px">Next</button>
 </div>
</section>
<section id="end" class="hide"><div class="card">
 <div class="meta">Quiz complete</div><div class="big" id="final"></div><p id="msg" class="sub"></p>
 <div id="missWrap" class="hide"><b>Review these:</b><ul class="miss" id="miss"></ul></div>
 <button class="btn" id="again">Try again</button>
 <button class="btn alt" id="redo">Redo only my mistakes</button>
 <button class="btn alt" id="home2">Change settings</button>
</div></section>
</main>

 else if(d.kind==="tf"){body.innerHTML=`<div class="prop">${esc(d.prop)}</div><div style="margin-bottom:8px;color:var(--mute)">Is this the correct answer?</div>`;
  [["True",true],["False",false]].forEach(([l,v])=>body.append(btn(l,b=>{if(locked)return;const ok=v===d.truth;
   [...body.querySelectorAll(".opt")].forEach(x=>{x.disabled=true;if(x.textContent===(d.truth?"True":"False"))x.classList.add("right")});if(!ok)b.classList.add("wrong");
   settle(ok,(ok?"<b>Correct!</b> ":"<b>Not quite.</b> ")+(d.truth?"That was the correct answer.":"The correct answer is: "+esc(q[2])+"."))})))}
 else{body.innerHTML='<input class="inp" id="ans" placeholder="Type your answer" autocomplete="off"><button class="btn" id="chk" style="margin-top:8px">Check</button>';
  const go=()=>{if(locked)return;const v=$("ans").value.trim();if(!v)return;$("ans").disabled=true;$("chk").classList.add("hide");const ok=check(v,q[2]);
   settle(ok,ok?"<b>Correct!</b> Answer: "+esc(q[2])+".":"<b>Not quite.</b> Answer: "+esc(q[2])+".");if(!ok)$("fix").classList.remove("hide")};
  $("chk").onclick=go;$("ans").onkeydown=e=>{if(e.key==="Enter")go()};$("ans").focus()}}
$("fix").onclick=()=>{missed.pop();score++;$("score").textContent=`Score: ${score}`;$("fix").classList.add("hide");$("exp").innerHTML="<b>Counted as correct.</b> Answer: "+esc(deck[i].q[2])+". "+esc(deck[i].q[4]);flash(true)};
$("next").onclick=()=>{i++;i<deck.length?render():finish()};

function finish(){show("end");const p=Math.round(score/deck.length*100);
 $("final").textContent=`${score} / ${deck.length} (${p}%)`;
 $("msg").textContent=p>=90?"Outstanding!":p>=70?"Solid work. Review the misses below.":"Keep practising. You’ll get there.";
 $("miss").innerHTML=missed.map(d=>`<li><b>${esc(d.q[1])}</b><br>${esc(d.q[2])}</li>`).join("");
 $("missWrap").classList.toggle("hide",!missed.length);$("redo").classList.toggle("hide",!missed.length)}
$("again").onclick=()=>{const d=newDeck();if(d)begin(d)};
$("redo").onclick=()=>begin(shuffle(missed.map(d=>build(d.q,type))));
$("home2").onclick=()=>show("home");
</script></body></html>
